<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>EduCore | Student Portal</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: Arial, sans-serif;
    background: #EAF5FF;
    color: #102A43;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
}

.container {
    width: 100%;
    max-width: 480px;
    background: white;
    padding: 35px;
    border-radius: 16px;
    box-shadow: 0 5px 25px rgba(0,0,0,0.08);
}

.logo {
    text-align: center;
    font-size: 28px;
    font-weight: bold;
    margin-bottom: 10px;
}

.logo span {
    color: #2196F3;
}

.subtitle {
    text-align: center;
    color: #627D98;
    margin-bottom: 25px;
    line-height: 1.5;
}

.tabs {
    display: flex;
    margin-bottom: 25px;
    background: #EAF5FF;
    border-radius: 8px;
    padding: 5px;
}

.tabs button {
    flex: 1;
    padding: 12px;
    border: none;
    cursor: pointer;
    border-radius: 6px;
    font-weight: bold;
    background: transparent;
    color: #102A43;
}

.tabs button.active {
    background: #2196F3;
    color: white;
}

.form-group {
    margin-bottom: 17px;
}

label {
    display: block;
    margin-bottom: 7px;
    font-weight: 600;
    font-size: 14px;
}

input, select {
    width: 100%;
    padding: 13px;
    border: 1px solid #BCCCDC;
    border-radius: 7px;
    font-size: 15px;
    outline: none;
}

input:focus, select:focus {
    border-color: #2196F3;
}

.subjects {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
}

.subjects label {
    display: flex;
    align-items: center;
    gap: 7px;
    font-weight: normal;
}

.subjects input {
    width: auto;
}

.submit-btn {
    width: 100%;
    padding: 14px;
    background: #2196F3;
    color: white;
    border: none;
    border-radius: 7px;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
    margin-top: 10px;
}

.submit-btn:hover {
    background: #1976D2;
}

.form-message {
    margin-top: 15px;
    text-align: center;
    font-size: 14px;
}

.back-link {
    display: block;
    text-align: center;
    margin-top: 22px;
    color: #2196F3;
    text-decoration: none;
}

.hidden {
    display: none;
}

@media(max-width: 400px) {
    .container {
        padding: 22px;
    }
}
</style>
</head>

<body>

<div class="container">

    <div class="logo">
        Edu<span>Core</span>
    </div>

    <p class="subtitle">
        Your journey to smarter learning starts here.
    </p>

    <div class="tabs">
        <button type="button" id="registerTab" class="active">
            Register
        </button>

        <button type="button" id="loginTab">
            Login
        </button>
    </div>

    <!-- REGISTRATION FORM -->

    <form id="studentRegisterForm">

        <div class="form-group">
            <label>Full Name</label>
            <input type="text" id="studentName"
            placeholder="Enter your full name" required>
        </div>

        <div class="form-group">
            <label>Email Address</label>
            <input type="email" id="studentEmail"
            placeholder="Enter your email" required>
        </div>

        <div class="form-group">
            <label>Password</label>
            <input type="password" id="studentPassword"
            placeholder="Create a password" minlength="8" required>
        </div>

        <div class="form-group">
            <label>Confirm Password</label>
            <input type="password" id="confirmPassword"
            placeholder="Confirm your password" required>
        </div>

        <div class="form-group">
            <label>Select Your Class</label>

            <select id="studentClass" required>
                <option value="">Choose your class</option>
                <option value="JSS1">JSS1</option>
                <option value="JSS2">JSS2</option>
                <option value="JSS3">JSS3</option>
                <option value="SS1">SS1</option>
                <option value="SS2">SS2</option>
                <option value="SS3">SS3</option>
            </select>
        </div>

        <div class="form-group">

            <label>Preferred Subjects</label>

            <div class="subjects">

                <label><input type="checkbox" name="subjects" value="Mathematics"> Mathematics</label>

                <label><input type="checkbox" name="subjects" value="English"> English</label>

                <label><input type="checkbox" name="subjects" value="Digital Technology"> Digital Technology</label>

                <label><input type="checkbox" name="subjects" value="Biology"> Biology</label>

                <label><input type="checkbox" name="subjects" value="Chemistry"> Chemistry</label>

                <label><input type="checkbox" name="subjects" value="Physics"> Physics</label>

                <label><input type="checkbox" name="subjects" value="Economics"> Economics</label>

                <label><input type="checkbox" name="subjects" value="Geography"> Geography</label>

            </div>

        </div>

        <button type="submit" class="submit-btn">
            Create Student Account
        </button>

    </form>


    <!-- LOGIN FORM -->

    <form id="studentLoginForm" class="hidden">

        <div class="form-group">
            <label>Email Address</label>
            <input type="email" id="loginEmail"
            placeholder="Enter your email" required>
        </div>

        <div class="form-group">
            <label>Password</label>
            <input type="password" id="loginPassword"
            placeholder="Enter your password" required>
        </div>

        <button type="submit" class="submit-btn">
            Login to EduCore
        </button>

    </form>

    <div id="formMessage" class="form-message"></div>

    <a href="index.html" class="back-link">
        ← Back to EduCore Home
    </a>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>

// SUPABASE CONNECTION

const SUPABASE_URL =
"https://xpcumdfehmfbxxycpghg.supabase.co";

const SUPABASE_KEY =
"sb_publishable_D42fTNuZmLQcExVgb9tCmw_wtfnzwc1";

console.log("Supabase library:", window.supabase);
console.log("Supabase URL:", SUPABASE_URL);
console.log("Supabase key loaded:", !!SUPABASE_KEY);

const supabaseClient = window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
);


// FORM ELEMENTS

const registerTab = document.getElementById("registerTab");
const loginTab = document.getElementById("loginTab");

const registerForm = document.getElementById("studentRegisterForm");
const loginForm = document.getElementById("studentLoginForm");

const formMessage = document.getElementById("formMessage");


// TAB SWITCHING

registerTab.addEventListener("click", function() {

    registerForm.classList.remove("hidden");
    loginForm.classList.add("hidden");

    registerTab.classList.add("active");
    loginTab.classList.remove("active");

    formMessage.textContent = "";

});


loginTab.addEventListener("click", function() {

    loginForm.classList.remove("hidden");
    registerForm.classList.add("hidden");

    loginTab.classList.add("active");
    registerTab.classList.remove("active");

    formMessage.textContent = "";

});


// DISPLAY MESSAGE

function showMessage(message, success = false) {

    formMessage.textContent = message;

    formMessage.style.color =
        success ? "green" : "red";

}


// STUDENT REGISTRATION

registerForm.addEventListener("submit", async function(event) {

    event.preventDefault();

    const fullName =
        document.getElementById("studentName").value.trim();

    const email =
        document.getElementById("studentEmail").value.trim();

    const password =
        document.getElementById("studentPassword").value;

    const confirmPassword =
        document.getElementById("confirmPassword").value;

    const classLevel =
        document.getElementById("studentClass").value;

    const subjects = Array.from(
        document.querySelectorAll(
            'input[name="subjects"]:checked'
        )
    ).map(input => input.value);


    if (password !== confirmPassword) {

        showMessage("Passwords do not match.");
        return;

    }

    if (subjects.length === 0) {

        showMessage("Please select at least one subject.");
        return;

    }


    const button = registerForm.querySelector("button");

    button.disabled = true;
    button.textContent = "Creating account...";


    try {

        const { data, error } =
            await supabaseClient.auth.signUp({

                email: email,

                password: password,

                options: {

                    data: {

                        account_type: "student",

                        full_name: fullName,

                        class_level: classLevel,

                        subjects: subjects

                    }

                }

            });


        if (error) throw error;


        showMessage(
            "Registration successful! Please check your email to confirm your account.",
            true
        );

        registerForm.reset();


    } catch (error) {

        showMessage(error.message);

    } finally {

        button.disabled = false;
        button.textContent = "Create Student Account";

    }

});


// STUDENT LOGIN

loginForm.addEventListener("submit", async function(event) {

    event.preventDefault();

    const email =
        document.getElementById("loginEmail").value.trim();

    const password =
        document.getElementById("loginPassword").value;


    const button = loginForm.querySelector("button");

    button.disabled = true;
    button.textContent = "Logging in...";


    try {

        const { data, error } =
            await supabaseClient.auth.signInWithPassword({

                email: email,

                password: password

            });


        if (error) throw error;


        const accountType =
            data.user.user_metadata.account_type;


        if (accountType !== "student") {

            await supabaseClient.auth.signOut();

            throw new Error(
                "This is not a student account. Please use the correct portal."
            );

        }


        showMessage("Login successful! Redirecting...", true);

        window.location.href = "student-dashboard.html";


    } catch (error) {

        showMessage(error.message);

    } finally {

        button.disabled = false;
        button.textContent = "Login to EduCore";

    }

});

</script>

</body>
</html>
